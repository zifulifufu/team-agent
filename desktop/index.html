<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `blob:` is here on purpose, and removing either one silently breaks the transcript.
      Every picture and clip a member produced — and every image attached to a message — reaches the
      renderer as bytes fetched with the app token, then goes into an object URL, because a plain
      `<img src="/api/...">` cannot carry that header. `'self'` does not cover `blob:` (for this
      `file://` document the URL is `blob:file:///…`, which matches nothing), and with no `media-src`
      the `default-src` fallback blocked clips. Measured in Electron itself:
      "Loading media from 'blob:file:///…' violates … default-src 'self' … blocked."
    -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self'" />
    <title>Team Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
